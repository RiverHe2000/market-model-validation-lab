[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-pricing-validation"
version = "0.1.0"
description = "Independent numerical and limited quote-slice validation of European index options"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
validation = ["QuantLib>=1.32"]
dev = ["pytest>=8", "ruff>=0.11", "QuantLib>=1.32"]

[project.scripts]
option-validation = "option_validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

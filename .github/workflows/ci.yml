name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned study environment
        run: python -m pip install -r requirements.lock
      - name: Install the two independent projects
        run: python -m pip install --no-deps -e ./market-risk-validation -e ./option-pricing-validation
      - name: Check root tooling
        run: python -m ruff check scripts
      - name: Check market risk source and tests
        working-directory: market-risk-validation
        run: python -m ruff check src tests
      - name: Check option source and tests
        working-directory: option-pricing-validation
        run: python -m ruff check src tests
      - name: Test market risk offline
        working-directory: market-risk-validation
        run: python -m pytest tests --junitxml=../artifacts/ci-market.xml
      - name: Test option pricing offline with QuantLib
        working-directory: option-pricing-validation
        run: python -m pytest tests --junitxml=../artifacts/ci-options.xml
      - name: Test acquisition validation offline
        run: python -m pytest scripts/tests --import-mode=importlib --junitxml=artifacts/ci-data.xml
      - name: Store test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/ci-*.xml

